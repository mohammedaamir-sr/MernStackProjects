<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/common.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Poppins', sans-serif;
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-white text-gray-900">
    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold">John</h1>
                <div class="hidden md:flex space-x-8">
                    <a href="pages/about.html" class="text-gray-700 hover:text-gray-900 transition">About</a>
                    <a href="pages/project.html" class="text-gray-700 hover:text-gray-900 transition">Projects</a>
                    <a href="pages/resume.html" class="text-gray-700 hover:text-gray-900 transition">Resume</a>
                    <a href="pages/tools.html" class="text-gray-700 hover:text-gray-900 transition">Tools</a>
                    <a href="pages/ama.html" class="text-gray-700 hover:text-gray-900 transition">AMA</a>
                </div>
                <!-- Mobile menu button -->
                <button class="md:hidden text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>

            </div>

            <!-- Left Content -->
            <div class="space-y-8">
                <div>

                        Hi, I'm <span class="gradient-text">Mohammed Aamir</span>
                    </h2>
                    <p class="text-xl text-gray-600">
                        Senior Full Stack Developer | ReactJS, Java, Microservices | 7+ Years Building Scalable Applications
                    </p>
                </div>

                <!-- CTA Buttons -->
                <div class="flex gap-4 pt-4">
                    <button class="px-8 py-3 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition font-medium">

                    </button>
                    <button class="px-8 py-3 border border-gray-900 text-gray-900 rounded-lg hover:bg-gray-50 transition font-medium">

                    </button>
                </div>

                <!-- Social Links -->
                <div class="flex gap-6 pt-4">
                    <a href="#" class="text-gray-600 hover:text-gray-900 transition">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">

                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"></path>

                            <path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2s9 5 20 5a9.5 9.5 0 00-9.5-9.5c0-.276.028-.55.081-.82A9.487 9.487 0 0023 3z"></path>

                    <img src="https://ik.imagekit.io/Aamir96/Aamir's%20Portfolio/Aamir%20Photo/Aamir%20Photo%20Coat.jpeg?updatedAt=1774690115073" alt="Mohammed Aamir" class="w-full h-full object-contain brightness-110 contrast-105 hover:brightness-100 transition-all duration-300">

            </div>
        </div>

        <!-- Skills/Stats Section -->
        <div class="grid grid-cols-3 gap-6 mt-24 py-12 border-t border-gray-100">
            <div class="text-center">
                <h3 class="text-3xl font-bold">7+</h3>
                <p class="text-gray-600 mt-2">Years Experience</p>
            </div>
            <div class="text-center">
                <h3 class="text-3xl font-bold">2M+</h3>
                <p class="text-gray-600 mt-2">Users Supported</p>
            </div>
            <div class="text-center">
                <h3 class="text-3xl font-bold">99.9%</h3>
                <p class="text-gray-600 mt-2">System Uptime</p>
            </div>
        </div>
    </main>

    <!-- Footer will be injected by common.js -->
    <script src="js/common.js"></script>
</body>
</html>
